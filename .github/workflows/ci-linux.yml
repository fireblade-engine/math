name: Linux

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  linux:
    name: Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    # Official Swift images instead of swift-actions/setup-swift, whose v3 fails on Linux (#57).
    container: swift:${{ matrix.swift }}
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.1", "6.2"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Tests (Release)
        run: swift test -c release --parallel -Xswiftc -warnings-as-errors

      - name: Check @inlinable Coverage
        run: |
          command -v python3 >/dev/null || { apt-get update -q && apt-get install -yq python3; }
          Scripts/check-inlinable.sh
