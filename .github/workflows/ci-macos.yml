name: macOS

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  macos:
    name: macOS (Swift ${{ matrix.swift }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift: "6.1"
            runner: "macos-14"
          - swift: "6.3"
            runner: "macos-latest"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Swift
        if: matrix.swift != '6.3'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift }}

      - name: Run Tests (Release)
        run: swift test -c release --parallel -Xswiftc -warnings-as-errors

      # Without the simd trait, FirebladeMath uses its portable implementations while Apple's
      # simd is still importable, so PortableVsSIMDTests compares the two.
      - name: Run Tests (Release, portable path vs Apple simd)
        run: swift test -c release --disable-default-traits --parallel -Xswiftc -warnings-as-errors

      - name: Check Differential Test Coverage
        run: python3 Scripts/check-simd-differential-coverage.py

      - name: Check Reference Value Coverage
        run: python3 Scripts/check-reference-coverage.py

      - name: Check @inlinable Coverage
        run: Scripts/check-inlinable.sh
