name: Benchmarks

# Runs the runtime benchmarks in Benchmarks/ and fails if any benchmark allocates more
# than recorded in Benchmarks/Thresholds/ (currently zero for every benchmark).
# Only allocation counts gate CI; timings on shared runners are too noisy to compare.

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  allocations:
    name: Allocation Thresholds
    runs-on: ubuntu-latest
    container: swift:6.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Allocation Thresholds
        working-directory: Benchmarks
        run: swift package benchmark thresholds check --metric mallocCountTotal --no-progress
