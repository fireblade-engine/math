name: Cross-Compile

# Exercises the platform C-library resolution in FirebladeMathLibC on targets
# that are not covered by the native Linux/macOS/Windows jobs.

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

# The container tags are bumped by Renovate. Scripts/install-swift-sdk.sh installs the
# SDK matching whatever toolchain the container provides.

jobs:
  musl:
    name: Static Linux (Musl)
    runs-on: ubuntu-latest
    container: swift:6.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Static Linux SDK
        run: |
          apt-get update -q && apt-get install -yq jq curl
          Scripts/install-swift-sdk.sh static

      # The static Linux SDK does not ship Swift Testing, so only the library is built.
      - name: Build
        run: swift build --swift-sdk x86_64-swift-linux-musl -Xswiftc -warnings-as-errors

  wasm:
    name: WebAssembly (WASI)
    runs-on: ubuntu-latest
    container: swift:6.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Wasm SDK
        run: |
          apt-get update -q && apt-get install -yq jq curl
          Scripts/install-swift-sdk.sh wasm

      # Runs the tests (including the cross-platform reference values) under WasmKit.
      - name: Run Tests
        run: |
          SDK=$(swift sdk list | grep -E '_wasm$' | head -n 1)
          swift test --swift-sdk "$SDK" -Xswiftc -warnings-as-errors

  android:
    name: Android
    runs-on: ubuntu-latest
    container: swift:6.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Android SDK
        run: |
          apt-get update -q && apt-get install -yq jq curl
          Scripts/install-swift-sdk.sh android

      - name: Install Android NDK
        run: |
          apt-get install -yq unzip
          curl -fsSL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q ndk.zip -d "$HOME"
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r27d" >> "$GITHUB_ENV"

      - name: Link NDK into Swift SDK
        run: |
          swift sdk list
          SETUP=$(find / -name setup-android-sdk.sh -path '*swift-*' 2>/dev/null | head -n 1)
          echo "Using $SETUP"
          test -n "$SETUP"
          bash "$SETUP"

      - name: Build (including tests)
        run: |
          # `swift sdk list` shows bundle names, so read the aarch64 target triples from the bundle
          # and build for the lowest Android API level it supports.
          SDK=$(find / -path '*android.artifactbundle*' -name swift-sdk.json 2>/dev/null \
            | xargs jq -r '.targetTriples | keys[]' | grep '^aarch64-' | sort -V | head -n 1)
          echo "Using Swift SDK $SDK"
          test -n "$SDK"
          swift build --swift-sdk "$SDK" --build-tests -Xswiftc -warnings-as-errors
